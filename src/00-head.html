<meta charset="utf-8">
<title>GoFarm App Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout concept: a studio review board. A sticky tab bar switches between the design system, each app's screen gallery
   (grouped by job, every frame labelled with its SRS requirement) and a click-through prototype on one phone. */
:root{
  /*THEME_VARS*/
  --accent-fg:#FFFFFF; --shadow:0 1px 2px rgba(20,40,30,.08),0 8px 24px rgba(20,40,30,.06);
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A14; --card:#15251C; --fg:#E7F0EA; --muted:#9BB0A3; --line:#25382D; --soft:#173626;
  --accent:#4FB77F; --accent-fg:#06180F; --chip:#1B2E23; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A14; --card:#15251C; --fg:#E7F0EA; --muted:#9BB0A3; --line:#25382D; --soft:#173626;
  --accent:#4FB77F; --accent-fg:#06180F; --chip:#1B2E23; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:1360px;margin:0 auto}
a{color:var(--accent)}
/* ---- viewer chrome ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-weight:700;font-size:22px;letter-spacing:-.02em}.brand b:first-child{color:var(--gold)}.brand b:last-child{color:var(--accent)}
.brand small{font-weight:600;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:0}
.tabs-v{display:flex;gap:6px;flex-wrap:wrap}
.tabs-v button{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs-v button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tabs-v button:focus-visible,.pv-list button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.intro{padding-block:28px 8px;max-width:78ch}
.intro h1{font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em;text-wrap:balance}
.intro p{margin:0;color:var(--muted);line-height:1.6;font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stats span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.sec-h{margin:40px 0 4px;font-size:20px;letter-spacing:-.01em}
.sec-p{margin:0 0 18px;color:var(--muted);max-width:78ch;line-height:1.55;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--fw),1fr));gap:26px 22px;align-items:start}
.fig{margin:0;min-width:0}
.fig figcaption{min-height:40px;align-content:flex-start;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;margin:0 0 8px;font-size:12.5px;line-height:1.35}
.fig figcaption b{font-size:13.5px}
.req{font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--accent);background:var(--chip);border:1px solid var(--line);padding:1px 7px;border-radius:6px}
.pri{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pri.must{color:var(--accent)}
.fw{position:relative;overflow:hidden;border-radius:calc(28px*var(--s,1));box-shadow:var(--shadow)}
.fw>.gf{transform-origin:0 0}
.wide .fw{border-radius:10px;cursor:zoom-in}
.wide.full .fw{overflow-x:auto;cursor:zoom-out}
.big-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.sw i{display:block;height:64px}
.sw div{padding:10px 12px;font-size:12px;line-height:1.4}.sw b{display:block;font-size:13px}.sw span{color:var(--muted)}
.spec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.spec h3{margin:0 0 14px;font-size:15px}
.spec .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.ty{display:grid;grid-template-columns:170px 1fr;gap:6px 18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.ty:last-child{border:0}.ty small{color:var(--muted);font-size:12px}
@media(max-width:560px){.ty{grid-template-columns:1fr}}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.icons div{text-align:center;font-size:11px;color:var(--muted);padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.icons svg{display:block;margin:0 auto 6px;color:var(--accent)}
.cov{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.cov table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
.cov th,.cov td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cov th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cov tr:last-child td{border:0}
/* ---- prototype ---- */
.pv{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding-top:8px}
.pv-phone{flex:0 0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.pv-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--muted)}
.pv-bar button{font:inherit;font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.pv-list{flex:1 1 280px;min-width:0;max-width:520px}
.pv-list h3{margin:0 0 8px;font-size:14px}
.pv-list .grp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pv-list button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 10px;border-radius:10px;cursor:pointer;text-align:left}
.pv-list button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pv-hint{font-size:12.5px;color:var(--muted);max-width:44ch;line-height:1.5}
footer{padding:48px 0 64px;color:var(--muted);font-size:12.5px;max-width:78ch;line-height:1.6}

/* ================= GoFarm app components (fixed light look: the apps have no dark mode in this phase) ================= */
.gf{--red:#D93A35;--reds:#FDECEB;
  font-family:'Open Sans',system-ui,sans-serif;font-size:14px;line-height:1.35;color:var(--ink);width:390px;height:844px;background:var(--page);display:flex;flex-direction:column;position:relative;overflow:hidden;text-align:left}
.gf *{box-sizing:border-box}
.gf svg.ic{flex:0 0 auto;display:block}
.gf .sb{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:600;background:#fff}
.gf .sb i{display:flex;gap:6px;align-items:center}.gf .sb i s{display:block;width:14px;height:14px;border-radius:50%;background:var(--ink)}.gf .sb i u{display:block;width:22px;height:11px;border-radius:3px;background:var(--ink)}
.gf.plain .sb{background:transparent}
.gf .ab{height:56px;flex:0 0 auto;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.gf .ab h2{margin:0;flex:1;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf .bd{flex:1;min-height:0;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.gf .bd.tight{gap:12px}.gf .bd.center{align-items:center;text-align:center}.gf .bd.mid{justify-content:center}
.gf .grow{flex:1;min-height:0}
.gf .tb{height:64px;flex:0 0 auto;background:#fff;border-top:1px solid var(--ln);display:flex}
.gf .tb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.gf .tb div.on{color:var(--g)}
.gf .btn{height:48px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;background:var(--g);color:#fff;cursor:pointer;padding:0 16px;text-align:center}
.gf .btn.gold{background:var(--gold);color:var(--ink)}.gf .btn.soft{background:var(--gs);color:var(--g)}.gf .btn.danger{background:var(--reds);color:var(--red)}
.gf .btn.outline{background:#fff;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}.gf .btn.sm{height:36px;border-radius:12px;font-size:12.5px;padding:0 14px}
.gf .btn.dis{background:var(--mutedbg);color:var(--mut)}
.gf .row{display:flex;align-items:center;gap:10px}.gf .row.sp{justify-content:space-between}.gf .row.top{align-items:flex-start}.gf .row.wrap{flex-wrap:wrap}.gf .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.gf .f1{flex:1;min-width:0}
.gf .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gs);color:var(--g);white-space:nowrap}
.gf .pill.good{background:var(--golds);color:var(--warn)}.gf .pill.warn{background:var(--warns);color:var(--warn)}.gf .pill.bad{background:var(--reds);color:var(--red)}.gf .pill.muted{background:var(--mutedbg);color:var(--mut)}
.gf .chip{padding:9px 16px;border-radius:12px;border:1.5px solid var(--ln);background:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.gf .chip.on{background:var(--gs);border-color:var(--g);color:var(--g)}
.gf .chips{display:flex;gap:8px;flex-wrap:wrap}
.gf .fld{display:flex;flex-direction:column;gap:6px;min-width:0}.gf .fld>label{font-size:12px;font-weight:700;color:var(--mut)}
.gf .fld>div{height:48px;border-radius:14px;border:1px solid var(--ln);background:#fff;display:flex;align-items:center;padding:0 14px;font-size:14px;gap:8px}
.gf .fld.foc>div{border:2px solid var(--g)}.gf .fld.err>div{border:2px solid var(--red)}.gf .fld>div.ph{color:var(--mut)}
.gf .fld em{font-style:normal;font-size:12px;color:var(--red)}
.gf .card{background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gf .card.pad16{padding:16px}.gf .card.green{background:var(--g);border-color:var(--g);color:#fff}.gf .card.red{background:var(--reds);border-color:#F6C5C3;box-shadow:none}
.gf .card.sel{border:2px solid var(--g)}
.gf .lc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px;min-width:0}
.gf .lc .ib{width:40px;height:40px;border-radius:12px;background:var(--gs);color:var(--g);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gf .pill.cur{background:#fff;color:var(--g);box-shadow:inset 0 0 0 1.5px var(--g)}.gf .lc .ib.muted{background:var(--mutedbg);color:var(--mut)}.gf .lc .ib.cur{background:#fff;color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
.gf .lc .ib.gold{background:var(--golds);color:var(--warn)}.gf .lc .ib.red{background:var(--reds);color:var(--red)}
.gf .lc b{font-size:15.5px;font-weight:600}.gf .lc small{color:var(--mut);font-size:13px}
.gf .pc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:12px}
.gf .pc .im{width:72px;height:72px;border-radius:16px;background:var(--gs);color:var(--g);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gf .pc b{font-size:16px;font-weight:600}.gf .pc small{color:var(--mut);font-size:12px}.gf .pc .pr{color:var(--g);font-weight:700;font-size:13.5px}
.gf .pc .go{background:var(--g);color:#fff;font-weight:700;font-size:12px;padding:8px 14px;border-radius:12px}
.gf .stat{background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.gf .stat small{color:var(--mut);font-size:12px}.gf .stat b{font-size:24px;font-weight:700;line-height:1.15}.gf .stat span{color:var(--mut);font-size:12px}
.gf .stat.red b{color:var(--red)}.gf .stat.g b{color:var(--g)}
.gf .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gf .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gf .al{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--gs);align-items:flex-start}
.gf .al b{display:block;font-size:14px;font-weight:700;color:var(--g)}.gf .al span{font-size:12.5px;color:var(--ink)}.gf .al svg{color:var(--g)}
.gf .al.warn{background:var(--warns)}.gf .al.warn b,.gf .al.warn svg{color:var(--warn)}
.gf .al.locked,.gf .al.bad{background:var(--reds)}.gf .al.locked b,.gf .al.locked svg,.gf .al.bad b,.gf .al.bad svg{color:var(--red)}
.gf .banner{height:150px;border-radius:22px;background:var(--g);color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative;overflow:hidden;flex:0 0 auto}
.gf .banner:before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--gold)}
.gf .banner:after{content:"";position:absolute;right:-6px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--gd)}
.gf .banner>*{position:relative;z-index:1;max-width:220px}.gf .banner b{font-size:18px;font-weight:700;line-height:1.25}.gf .banner span{font-size:13.5px}
.gf .banner i{font-style:normal;align-self:flex-start;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px}
.gf .banner.pics:before{right:-30px;top:-50px;width:190px;height:190px}.gf .banner.pics:after{display:none}
.gf .banner.pics>*{max-width:176px}.gf .banner.pics .ph1,.gf .banner.pics .ph2{position:absolute;z-index:1;border-radius:14px;border:3px solid #fff;object-fit:cover;box-shadow:0 6px 14px rgba(0,0,0,.28);max-width:none}
.gf .banner.pics .ph1{right:96px;top:26px;width:70px;height:96px;transform:rotate(-6deg)}.gf .banner.pics .ph2{right:14px;top:22px;width:104px;height:104px;transform:rotate(4deg)}
.gf .pc .im.photo{padding:5px;overflow:hidden;background:linear-gradient(145deg,#fff,var(--gs2));border:1px solid var(--ln)}.gf .pc .im.photo img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 5px rgba(53,83,59,.25))}
.gf .dots{display:flex;justify-content:center;gap:6px}.gf .dots i{width:6px;height:6px;border-radius:3px;background:var(--ln)}.gf .dots i.on{width:18px;background:var(--g)}
.gf .stp{display:flex;align-items:center;gap:14px}.gf .stp i{width:44px;height:44px;border-radius:12px;background:var(--gs);color:var(--g);display:flex;align-items:center;justify-content:center;font-style:normal}
.gf .stp i.pl{background:var(--g);color:#fff}.gf .stp b{font-size:26px;font-weight:700}
.gf .sec{display:flex;justify-content:space-between;align-items:center}.gf .sec b{font-size:18px;font-weight:700}.gf .sec span{color:var(--g);font-weight:600}
.gf h3.t{margin:0;font-size:18px;font-weight:700}.gf h1.t{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}.gf p.m{margin:0;color:var(--mut);font-size:13.5px;line-height:1.5}.gf p.cap{margin:0;color:var(--mut);font-size:12px;line-height:1.45}
.gf .wm{font-weight:700;letter-spacing:-.02em;line-height:1}.gf .wm b:first-child{color:var(--gold)}.gf .wm b:last-child{color:var(--g)}
.gf .circ{width:96px;height:96px;border-radius:50%;background:var(--gs);color:var(--g);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gf .circ.gold{background:var(--golds);color:var(--warn)}.gf .circ.red{background:var(--reds);color:var(--red)}
.gf .kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.gf .kv span{color:var(--mut)}.gf .kv b{font-weight:600;text-align:right}
.gf .hr{height:1px;background:var(--ln)}
.gf .dim{position:absolute;left:0;right:0;top:44px;bottom:0;background:rgba(41,46,40,.45)}
.gf .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:12px 20px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.gf .sheet:before{content:"";width:44px;height:5px;border-radius:3px;background:var(--ln);align-self:center}
.gf .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.gf .cal .wk{text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:2px 0}
.gf .d{height:52px;border-radius:12px;background:#fff;border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;font-size:13px}
.gf .d small{font-size:9.5px;color:var(--mut);font-weight:600}.gf .d.del{background:var(--gs);border-color:transparent;color:var(--g)}.gf .d.pau{background:var(--warns);border-color:transparent;color:var(--warn)}
.gf .d.mis{background:var(--reds);border-color:transparent;color:var(--red)}.gf .d.tod{border:2px solid var(--g);color:var(--g)}.gf .d.emp{background:transparent;border-color:transparent}
.gf .d small{letter-spacing:-.02em}.gf .d.up{background:var(--mutedbg);border-color:transparent;color:var(--mut)}.gf .d.up small{color:var(--mut)}.gf .d.del small{color:var(--g)}.gf .d.pau small{color:var(--warn)}.gf .d.mis small{color:var(--red)}.gf .d.tod small{color:var(--g)}
.gf .cleg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 9px;font-size:11px;font-weight:600;color:var(--mut)}.gf .cleg span{display:flex;align-items:center;gap:4px}
.gf .cleg i{width:14px;height:14px;border-radius:5px;display:block;background:var(--gs)}.gf .cleg i.mis{background:var(--reds)}.gf .cleg i.pau{background:var(--warns)}.gf .cleg i.up{background:var(--mutedbg)}.gf .cleg i.tod{background:#fff;box-shadow:inset 0 0 0 2px var(--g)}
.gf .d.sel2{outline:2px solid var(--ink);outline-offset:1px}
.gf .qr{width:150px;height:150px;border-radius:14px;background:#fff;padding:10px;border:1px solid var(--ln)}
.gf .hot{outline:2px dashed transparent}
.gf [data-go]{cursor:pointer}
.pvmode .gf [data-go]:hover{filter:brightness(.96)}
.gf .prog{height:8px;border-radius:4px;background:var(--mutedbg);overflow:hidden}.gf .prog i{display:block;height:100%;background:var(--gold);border-radius:4px}
.gf .ph-img{background:repeating-linear-gradient(45deg,var(--gs),var(--gs) 10px,var(--gs2) 10px,var(--gs2) 20px);color:var(--g);display:flex;align-items:center;justify-content:center}
.gf .scan{background:var(--ink);border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gf .scan:before{content:"";width:62%;aspect-ratio:1;border:3px solid var(--gold);border-radius:22px}
.gf .scan:after{content:"";position:absolute;left:19%;right:19%;top:50%;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.gf .off{background:var(--warns);color:var(--warn);font-weight:700;font-size:12px;padding:6px 16px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.gf .tbl{display:flex;flex-direction:column}.gf .tbl .r{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-size:13px}
